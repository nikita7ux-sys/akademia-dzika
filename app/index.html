@media (prefers-color-scheme:dark){:root{--bg:#17111a;--fg:#efe7ec;--muted:#b5a6ae;--line:#3a2d3f}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

<script>
// Одна ссылка «Поделиться» из приложения: телефон сам уходит в свой магазин, компьютер видит обе кнопки.
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var tags = { uk: 'Польська для життя в Польщі · з нуля до B1', en: 'Polish for life in Poland · from zero to B1', pl: 'Polski do życia w Polsce · od zera do B1' };
  var lang = (navigator.language || 'ru').slice(0, 2);
  if (tags[lang]) document.getElementById('tag').textContent = tags[lang];
  var go = ios ? 'ios' : android ? 'android' : null;
  if (go) location.replace(document.getElementById(go).href);
})();
</script>
